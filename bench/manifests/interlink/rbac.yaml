# ServiceAccount used by interlinkd sidecars.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: interlink
  namespace: bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interlink
  namespace: bench
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interlink
  namespace: bench
subjects:
  - kind: ServiceAccount
    name: interlink
    namespace: bench
roleRef:
  kind: Role
  name: interlink
  apiGroup: rbac.authorization.k8s.io
