# interlinkd as a node-level daemon (ztunnel-style), hostNetwork.
#
# Interception model (single workload port, matching what the other meshes
# intercept — the app's traffic, not cluster infrastructure):
#   - Pod egress (packets arriving from local pod veths) destined for the pod
#     CIDR on the workload port -> outbound proxy :4140, which recovers the
#     original destination via SO_ORIGINAL_DST and dials it over mTLS
#     (mux tunnels when the peer negotiates il/mux/1).
#   - Cross-node mesh traffic (packets arriving on eth0) destined for local
#     pods on the workload port -> inbound proxy :4143, which terminates mTLS
#     and forwards to the recovered original destination.
#   - Host-originated traffic (kubelet probes, the proxy's own upstream dials)
#     is never redirected: locally generated packets don't traverse PREROUTING,
#     and there are deliberately no OUTPUT-chain rules (a catch-all OUTPUT
#     redirect eats control-plane traffic and melts the cluster — observed).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: interlink
  namespace: bench
  labels:
    app: interlink
spec:
  selector:
    matchLabels:
      app: interlink
  template:
    metadata:
      labels:
        app: interlink
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: interlink
      initContainers:
        - name: iptables-init
          image: alpine:3.20
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache iptables
              POD_CIDR="10.244.0.0/16"
              APP_PORT="8080"
              iptables -t nat -N INTERLINK 2>/dev/null || true
              iptables -t nat -F INTERLINK
              # Pod egress (local pod veth) -> outbound proxy.
              iptables -t nat -A INTERLINK -i veth+ -p tcp -d "${POD_CIDR}" --dport "${APP_PORT}" -j REDIRECT --to-ports 4140
              # Cross-node mesh traffic (node uplink) -> inbound proxy.
              iptables -t nat -A INTERLINK -i eth0 -p tcp -d "${POD_CIDR}" --dport "${APP_PORT}" -j REDIRECT --to-ports 4143
              iptables -t nat -D PREROUTING -j INTERLINK 2>/dev/null || true
              iptables -t nat -A PREROUTING -j INTERLINK
          volumeMounts:
            - name: xtables-lock
              mountPath: /run/xtables.lock
      containers:
        - name: interlinkd
          image: interlink-bench/interlinkd:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: INTERLINK_TRUST_DOMAIN
              value: "bench.local"
            - name: INTERLINK_IDENTITY
              value: "spiffe://bench.local/ns/bench/sa/proxy"
            - name: INTERLINK_CA_BUNDLE_PATH
              value: "/etc/interlink/certs/ca.der"
            - name: INTERLINK_CERT_PATH
              value: "/etc/interlink/certs/server.der"
            - name: INTERLINK_KEY_PATH
              value: "/etc/interlink/certs/server.key"
            - name: INTERLINK_ALLOW_ALL
              value: "true"
            - name: INTERLINK_MUX
              value: "${INTERLINK_MUX}"
            - name: INTERLINK_LOG_LEVEL
              value: "warn"
            - name: INTERLINK_MAX_CONNECTIONS
              value: "20000"
          ports:
            - containerPort: 4143
              name: inbound
            - containerPort: 4140
              name: outbound
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: certs
              mountPath: /etc/interlink/certs
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
      volumes:
        - name: certs
          secret:
            secretName: interlink-certs
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
