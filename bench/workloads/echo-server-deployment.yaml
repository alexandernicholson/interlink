apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      nodeSelector:
        bench-role: server
      containers:
        - name: echo-server
          image: interlink-bench/echo-server:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":8080", "-delay", "200ms"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: bench
spec:
  selector:
    app: echo-server
  ports:
    - port: 8080
      targetPort: 8080
      name: http
