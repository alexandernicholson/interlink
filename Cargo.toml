[package]
name = "interlink"
version = "0.1.0"
edition = "2021"
description = "A lightweight, RFC-backed service mesh proxy for cloud-to-edge"

[lib]
name = "interlink"
path = "src/lib.rs"

[[bin]]
name = "interlinkd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
rustls-pki-types = "1"
tokio-rustls = "0.26"
x509-parser = "0.18"
rcgen = "0.13"
time = "0.3"
ring = "0.17"
http = "1"
hickory-resolver = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
socket2 = "0.5"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dashmap = "6"
arc-swap = "1"
parking_lot = "0.12"
url = "2"
base64 = "0.22"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio-test = "0.4"
quickcheck = "1"
proptest = "1"

[[bench]]
name = "proxy"
harness = false
[[bench]]
name = "crypto"
harness = false

[[example]]
name = "ca_bootstrap"
path = "examples/ca_bootstrap.rs"

[[example]]
name = "backend"
path = "examples/backend.rs"

[[example]]
name = "frontend"
path = "examples/frontend.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
