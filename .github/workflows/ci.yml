# CI gate — same checks as .githooks/pre-commit / scripts/preflight.sh (rules D8/D9).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        timeout-minutes: 3
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset auth CI_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component llvm-tools-preview && rustup default stable
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - name: preflight (clippy + tests + microbenchmark paths)
        run: ./scripts/preflight.sh
