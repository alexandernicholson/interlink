# CI gate — same checks as .githooks/pre-commit / scripts/preflight.sh (rules D8/D9).
name: ci
on:
  push:
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component llvm-tools-preview && rustup default stable
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: preflight (clippy + tests + microbenchmark paths)
        run: ./scripts/preflight.sh
