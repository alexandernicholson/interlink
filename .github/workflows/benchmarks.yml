name: mesh benchmarks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'test-support/**'
      - 'bench/**'
      - '!bench/results/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency:
  group: mesh-benchmark-refresh
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out current main source
        timeout-minutes: 3
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --depth=1 origin refs/heads/main
          unset auth CI_TOKEN
          git checkout --detach FETCH_HEAD
          printf 'BENCH_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture and validate the complete comparison
        timeout-minutes: 100
        run: ./bench/run.sh
      - name: Enforce the repository commit gate
        timeout-minutes: 60
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --locked --version 0.6.21
          ./scripts/preflight.sh
      - name: Publish only against the measured source HEAD
        timeout-minutes: 3
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BENCH_SOURCE_SHA"
          python3 - "$BENCH_SOURCE_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          assert json.loads(Path('bench/results/capture.json').read_text())['revision'] == sys.argv[1]
          PY
          python3 -B bench/scripts/aggregate.py --results bench/results --output bench/results/comparison.md --check
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          unset auth CI_TOKEN
          python3 -B bench/scripts/run_capture.py --check-remote "$BENCH_SOURCE_SHA"
          git config user.name 'interlink benchmark refresh'
          git config user.email 'benchmark-refresh@users.noreply.github.com'
          git add --all -- bench/results
          git commit -m 'bench: refresh matched mesh comparison' \
            -m "Results-only generated capture of ${BENCH_SOURCE_SHA}; runtime source is unchanged."
          # The commit's parent is the measured source, so a concurrent main update
          # makes this ordinary fast-forward push fail. Never rebase stale evidence.
          git push origin HEAD:refs/heads/main
